name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - run: pip install -c requirements.txt -e ".[dev,serve,tracking]"
      - name: Lint (unused code, naming, missing type hints and docstrings)
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Unit tests
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build (trains the model in the first stage)
        run: docker build -t loan-default:ci .
      - name: Run read-only as a non-root user with no capabilities
        run: docker run -d --name app --read-only --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 loan-default:ci
      - name: Smoke test, including p95 latency
        run: scripts/smoke_test.sh
      - name: Memory stays under 600 MiB after the smoke test
        run: |
          used=$(docker stats --no-stream --format '{{.MemUsage}}' app | awk '{print $1}')
          echo "Container memory: $used"
          python3 -c "import re,sys; v,u=re.match(r'([0-9.]+)([KMG]i?B)',sys.argv[1]).groups(); mib=float(v)*{'KiB':1/1024,'MiB':1,'GiB':1024}[u]; sys.exit(mib > 600)" "$used"
      - name: Container logs
        if: failure()
        run: docker logs app

  analysis:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - run: pip install -c requirements.txt -e .
      - name: Year-by-year validation
        run: python -m loan_default.temporal --out-dir analysis
      - name: Drift between training data and 2016
        run: python -m loan_default.drift --out-dir analysis
      - name: Add the reports to the run summary
        run: cat analysis/temporal_validation.md analysis/drift_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: analysis-reports
          path: analysis/
