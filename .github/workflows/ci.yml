name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -c constraints.txt -e ".[dev,serve,tracking]"
      - name: Lint (unused code, naming, missing type hints and docstrings)
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Unit tests
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build (trains the model in the first stage)
        run: docker build -t loan-default:ci .
      - name: Run read-only as a non-root user with no capabilities
        run: docker run -d --name app --read-only --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 loan-default:ci
      - name: Smoke test
        run: scripts/smoke_test.sh
      - name: Container logs
        if: failure()
        run: docker logs app
